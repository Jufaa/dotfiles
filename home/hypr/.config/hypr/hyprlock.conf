# Pantalla de bloqueo, pensada para verse igual que el login de SDDM
# (tema simple_sddm_2). Los valores replican su theme.conf:
#   Background="Backgrounds/default"  -> misma imagen que .wallpaper_current
#   PartialBlur="true" / BlurMax="32" -> blur
#   FormPosition="left"               -> formulario a la izquierda
#   HourFormat="hh:mm AP"             -> 12 horas con AM/PM
#   DateFormat="dddd d MMMM"

# BACKGROUND
background {
  monitor =
  # Misma imagen que usa SDDM: la copia que los scripts de wallpaper
  # mantienen al dia en cada cambio de fondo.
  path = ~/.config/hypr/wallpaper_effects/.wallpaper_current
  blur_passes = 3
  blur_size = 8
  brightness = 0.8
}

general {
  ignore_empty_input = true
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 60
  outline_thickness = 2
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.4 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  outer_color = rgba(ffffffff)        # full white
  inner_color = rgba(ffffff40)        # faded white
  font_color = rgba(ffffffff)         # full white
  check_color = rgba(ff0000ff)        # solid red
  font_family = CaskaydiaCove Nerd Font Mono, monospace
  placeholder_text = input password...
  fade_on_empty = false
  rounding = -1
  position = 300, -60
  halign = left
  valign = center
}

# TIME
label {
  monitor =
  # LC_TIME=C fuerza el AM/PM: el locale es_AR deja %p vacio. SDDM lo muestra
  # igual porque usa el formateador propio de Qt.
  text = cmd[update:1000] echo "$(LC_TIME=C date +"%I:%M %p")"
  color = rgba(ffffffff)
  font_size = 95
  font_family = CaskaydiaCove Nerd Font Mono, monospace
  position = 300, 150
  halign = left
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:60000] echo "$(date +"%A %-d %B")"
  color = rgba(ffffffff)
  font_size = 22
  font_family = CaskaydiaCove Nerd Font Mono, monospace
  position = 305, 60
  halign = left
  valign = center
}

# GREETING
label {
  monitor =
  text = cmd[update:1000] echo "welcome back, $(whoami)"
  color = rgba(ffffffff)
  font_size = 14
  font_family = CaskaydiaCove Nerd Font Mono, monospace
  position = 305, -130
  halign = left
  valign = center
}
